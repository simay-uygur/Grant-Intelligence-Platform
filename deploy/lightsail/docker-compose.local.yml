services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      FRONTEND_HOST: frontend
      FRONTEND_PORT: "3000"
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ../../frontend
      target: dev
      args:
        VITE_API_MODE: api
        VITE_API_URL: ""
        VITE_AUTH_REQUIRED: "false"
    expose:
      - "3000"
    environment:
      VITE_API_MODE: api
      VITE_API_URL: ""
      VITE_AUTH_REQUIRED: "false"
    volumes:
      # Mount host frontend directory for instant hot-module-reloading
      - ../../frontend:/app
      # Keep container node_modules isolated
      - /app/node_modules

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend --reload-dir /app/agent"]
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - ../../.env
    environment:
      SQLITE_DB_PATH: /app/storage/backend.db
      FRONTEND_CORS_ORIGINS: '["http://localhost:8080","http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'
      DEBUG: "false"
      # Use the host's AWS credentials inside the container (Bedrock access).
      AWS_PROFILE: ${AWS_PROFILE:-grant-platform}
    volumes:
      # Mount source code for live hot-reloading
      - ../../backend:/app/backend
      - ../../agent:/app/agent
      # Keep SQLite data on the host so deleting or creating an application
      # survives backend image rebuilds and container recreation.
      - ../../storage:/app/storage
      # Read-only mount of your local AWS profiles (SSO tokens, keys).
      - ${HOME}/.aws:/root/.aws:ro

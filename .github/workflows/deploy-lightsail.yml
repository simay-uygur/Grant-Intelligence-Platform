name: Deploy to Lightsail

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: choice
        options: [main, develop]

permissions:
  contents: read

concurrency:
  group: lightsail-${{ github.ref_name || inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_PAGER: ""
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      SERVICE_NAME: ${{ secrets.LIGHTSAIL_SERVICE || ((github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name) == 'main' && 'grant-intelligence-main' || 'grant-intelligence-develop') }}
      IMAGE_TAG: ${{ github.sha }}
      LIGHTSAIL_POWER: micro
      LIGHTSAIL_SCALE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Lightsail service if missing
        run: |
          if aws lightsail get-container-services --service-name "$SERVICE_NAME" >/dev/null 2>&1; then
            echo "Lightsail service already exists: $SERVICE_NAME"
          else
            echo "Creating Lightsail service: $SERVICE_NAME"
            aws lightsail create-container-service \
              --service-name "$SERVICE_NAME" \
              --power "$LIGHTSAIL_POWER" \
              --scale "$LIGHTSAIL_SCALE"
          fi

      - name: Wait for Lightsail service
        run: |
          for attempt in $(seq 1 36); do
            state=$(aws lightsail get-container-services \
              --service-name "$SERVICE_NAME" \
              --query 'containerServices[0].state' \
              --output text)
            echo "Lightsail service state: $state"
            if [ "$state" = "READY" ] || [ "$state" = "RUNNING" ]; then
              exit 0
            fi
            if [ "$state" = "DISABLED" ] || [ "$state" = "DELETING" ]; then
              echo "Lightsail service entered an unusable state: $state"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Lightsail service: $SERVICE_NAME"
          exit 1

      - name: Install Lightsail Control plugin
        run: |
          sudo curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl
          lightsailctl --version || true

      - name: Build and test frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Test backend
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pytest tests -q

      - name: Build images
        run: |
          docker build -t frontend:${IMAGE_TAG} --build-arg VITE_API_MODE=api --build-arg VITE_API_URL= --build-arg VITE_AUTH_REQUIRED=true frontend
          docker build -t backend:${IMAGE_TAG} -f backend/Dockerfile .
          docker build -t nginx:${IMAGE_TAG} -f- deploy/lightsail <<'EOF'
          FROM nginx:1.29-alpine
          COPY nginx.conf /etc/nginx/nginx.conf
          EOF

      - name: Push images to Lightsail
        run: |
          aws lightsail push-container-image --service-name "$SERVICE_NAME" --label frontend --image "frontend:${IMAGE_TAG}"
          aws lightsail push-container-image --service-name "$SERVICE_NAME" --label backend --image "backend:${IMAGE_TAG}"
          aws lightsail push-container-image --service-name "$SERVICE_NAME" --label nginx --image "nginx:${IMAGE_TAG}"

      - name: Create Lightsail deployment specification
        env:
          BACKEND_ENV: ${{ secrets.LIGHTSAIL_BACKEND_ENV }}
        run: |
          python3 - <<'PY'
          import json, os

          env = {}
          for line in os.environ.get("BACKEND_ENV", "").splitlines():
              if line.strip() and not line.lstrip().startswith("#"):
                  key, value = line.split("=", 1)
                  env[key.strip()] = value.strip()
          env["AUTH_REQUIRED"] = "true"
          if len(env.get("AUTH_SECRET_KEY", "")) < 32:
              raise SystemExit("LIGHTSAIL_BACKEND_ENV must contain AUTH_SECRET_KEY with at least 32 characters")

          spec = {
              "containers": {
                  "nginx": {
                      "image": ":%s.nginx.latest" % os.environ["SERVICE_NAME"],
                      "ports": {"80": "HTTP"},
                  },
                  "frontend": {
                      "image": ":%s.frontend.latest" % os.environ["SERVICE_NAME"],
                      "ports": {"3000": "HTTP"},
                  },
                  "backend": {
                      "image": ":%s.backend.latest" % os.environ["SERVICE_NAME"],
                      "ports": {"8000": "HTTP"},
                      "environment": env,
                  },
              },
          }
          with open("lightsail-deployment.json", "w") as f:
              json.dump(spec, f)
          with open("lightsail-public-endpoint.json", "w") as f:
              json.dump({
                  "containerName": "nginx",
                  "containerPort": 80,
                  "healthCheck": {"path": "/", "successCodes": "200-399"},
              }, f)
          PY

      - name: Deploy
        run: |
          aws lightsail create-container-service-deployment \
            --service-name "$SERVICE_NAME" \
            --containers file://lightsail-deployment.json \
            --public-endpoint file://lightsail-public-endpoint.json

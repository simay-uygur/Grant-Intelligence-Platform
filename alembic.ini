# Alembic configuration.
#
# Common commands:
#   alembic upgrade head                                  # apply migrations
#   alembic revision --autogenerate -m "..."              # generate a new migration
#   alembic stamp head                                    # mark an existing DB as up-to-date
#
# The target database comes from DATABASE_URL (falls back to local SQLite),
# see backend/core/config.py and backend/migrations/env.py.

[alembic]
script_location = backend/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
